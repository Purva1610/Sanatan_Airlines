# Public HTTP entry point for the Sanatan Airlines stack.
# nginx terminates the connection and routes page traffic to Next.js while
# lead, admin and health endpoints go to the Express API.
# For HTTPS, replace this file with a TLS configuration; see nginx/tls.conf.example.

# Keep the client-facing scheme when TLS is terminated by an ALB or CloudFront.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    http    http;
    https   https;
}

upstream sanatan_web {
    server web:3000;
    keepalive 16;
}

upstream sanatan_api {
    server api:4000;
    keepalive 8;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # CV uploads are capped at 5 MB by the API; leave room for multipart overhead.
    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/manifest+json;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Express API. /api/assistant stays on Next.js via the fallback location.
    location = /api/health {
        proxy_pass http://sanatan_api;
    }

    location ^~ /api/leads {
        proxy_pass http://sanatan_api;
    }

    location ^~ /api/admin {
        proxy_pass http://sanatan_api;
    }

    location / {
        proxy_pass http://sanatan_web;
    }
}
